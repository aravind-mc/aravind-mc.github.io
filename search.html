<!DOCTYPE html>
<html>
<head>
    <title>v-safe Search</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/algoliasearch/4.14.2/algoliasearch-lite.umd.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .search-box, .facet-search {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .facet-search {
            width: 50%;
        }

        .facet-panel {
            padding: 20px;
            background: #fff;
            border-radius: 4px;
        }

        .facet-group {
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background: #fff;
        }

        .facet-title {
            font-weight: 500;
            margin-bottom: 10px;
            padding: 0.75rem;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .facet-content {
            padding: 1rem;
        }

        .facet-value {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .facet-count {
            margin-left: auto;
            color: #666;
        }

        .results {
            display: grid;
            gap: 15px;
        }

        .hit {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }

        .stats {
            margin-bottom: 15px;
            color: #666;
        }

        .hit a {
            color: #0066cc;
            text-decoration: none;
        }

        .hit a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<p>
    <span>Powered by <a target="_blank" href="https://algolia.com"><img src="static/img/algolia_logo.png" alt="Algolia"
                                                                        height="15" style="vertical-align: middle;"></a></span>
</p>
<h1>v-safe Search</h1>
<input type="text" id="searchBox" class="search-box" placeholder="Search v-safe...">

<div class="container">
    <div class="facet-panel">
        <div class="facet-group">
            <div class="facet-title">Age</div>
            <div class="facet-content">
                <input type="text" class="facet-search" id="ageSearch" placeholder="Search age groups...">
                <div id="ageFacets"></div>
            </div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Sex</div>
            <div class="facet-content" id="sexFacets"></div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Relationship</div>
            <div class="facet-content" id="relationshipFacets"></div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Manufacturer</div>
            <div class="facet-content" id="manufacturerFacets"></div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Number of Doses</div>
            <div class="facet-content" id="dosesFacets"></div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Most Severe Outcome</div>
            <div class="facet-content" id="msoFacets"></div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Preferred Term</div>
            <div class="facet-content">
                <input type="text" class="facet-search" id="ptSearch" placeholder="Search preferred terms...">
                <div id="ptFacets"></div>
            </div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Minimum Days to Symptom</div>
            <div class="facet-content">
                <input type="text" class="facet-search" id="mdpSearch" placeholder="Search minimum days...">
                <div id="mdpFacets"></div>
            </div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Lower Level Term</div>
            <div class="facet-content">
                <input type="text" class="facet-search" id="lltSearch" placeholder="Search lower level terms...">
                <div id="lltFacets"></div>
            </div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Number of Check-ins</div>
            <div class="facet-content">
                <input type="text" class="facet-search" id="nrSearch" placeholder="Search number of check-ins...">
                <div id="numRowsFacets"></div>
            </div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Checkin Span</div>
            <div class="facet-content">
                <input type="text" class="facet-search" id="csSearch" placeholder="Search checkin span...">
                <div id="checkinSpanFacets"></div>
            </div>
        </div>

        <div class="facet-group">
            <div class="facet-title">Vaccine Enthusiast</div>
            <div class="facet-content" id="veFactets"></div>
        </div>
    </div>

    <div>
        <div id="stats" class="stats"></div>
        <div id="hits" class="results"></div>
    </div>
</div>

<script>
    const searchClient = algoliasearch(
        'T4IEG517PD',
        '9d30fa88591b049d83a1da246c881f01'
    );

    const index = searchClient.initIndex('output');

    let currentRefinements = {
        MANU: [],
        SEX: [],
        ND: [],
        MSO: [],
        AGE: [],
        PT: [],
        LLT: [],
        NR: [],
        DEP: [],
        MDP: [],
        CS: [],
        VE: []
    };

    let facetSearchValues = {
        AGE: '',
        PT: '',
        LLT: '',
        NR: '',
        MDP: '',
        CS: ''
    };

    function constructURL(id) {
        return `vsafe/index.html?id=${id}`;
    }

    async function performSearch() {
        const query = document.getElementById('searchBox').value;

        try {
            const {hits, nbHits, facets} = await index.search(query, {
                facets: ['MANU', 'SEX', 'ND', 'MSO', 'AGE', 'PT', 'LLT', 'NR', 'DEP', 'MDP', 'CS', 'VE'],
                facetFilters: [
                    ...currentRefinements.MANU.map(value => `MANU:${value}`),
                    ...currentRefinements.SEX.map(value => `SEX:${value}`),
                    ...currentRefinements.ND.map(value => `ND:${value}`),
                    ...currentRefinements.MSO.map(value => `MSO:${value}`),
                    ...currentRefinements.AGE.map(value => `AGE:${value}`),
                    ...currentRefinements.PT.map(value => `PT:${value}`),
                    ...currentRefinements.LLT.map(value => `LLT:${value}`),
                    ...currentRefinements.NR.map(value => `NR:${value}`),
                    ...currentRefinements.DEP.map(value => `DEP:${value}`),
                    ...currentRefinements.MDP.map(value => `MDP:${value}`),
                    ...currentRefinements.CS.map(value => `CS:${value}`),
                    ...currentRefinements.VE.map(value => `VE:${value}`)
                ]
            });

            displayResults(hits, nbHits);

            if (facets) {
                displayFacets('manufacturerFacets', facets.MANU, 'MANU');
                displayFacets('sexFacets', facets.SEX, 'SEX');
                displayFacets('dosesFacets', facets.ND, 'ND');
                displayFacets('msoFacets', facets.MSO, 'MSO');
                displayFacets('ageFacets', facets.AGE, 'AGE');
                displayFacets('ptFacets', facets.PT, 'PT');
                displayFacets('mdpFacets', facets.MDP, 'MDP');
                displayFacets('lltFacets', facets.LLT, 'LLT');
                displayFacets('numRowsFacets', facets.NR, 'NR');
                displayFacets('relationshipFacets', facets.DEP, 'DEP');
                displayFacets('checkinSpanFacets', facets.CS, 'CS');
                displayFacets('veFacets', facets.VE, 'VE');
            }
        } catch (error) {
            console.error('Search error:', error);
        }
    }

    function displayResults(hits, nbHits) {
        const statsDiv = document.getElementById('stats');
        statsDiv.textContent = `${nbHits} results found`;

        const hitsDiv = document.getElementById('hits');
        hitsDiv.innerHTML = hits.map(hit => `
                <div class="hit">
                    <div><strong>Registration Code:</strong> <a href="${constructURL(hit.ID)}" target="_blank">${hit.ID}</a></div>
                    <div><strong>Manufacturer:</strong> ${hit.MANU}</div>
                    <div><strong>Sex:</strong> ${hit.SEX || 'N/A'}</div>
                    <div><strong>Relationship:</strong> ${hit.DEP || 'N/A'}</div>
                    <div><strong>Number of Doses:</strong> ${hit.ND}</div>
                    <div><strong>Most Severe Outcome:</strong> ${hit.MSO}</div>
                    <div><strong>Age Group:</strong> ${hit.AGE || 'N/A'}</div>
                    <div><strong>Preferred Term:</strong> ${hit.PT || 'N/A'}</div>
                    <div><strong>Minimum Days to Symptom:</strong> ${hit.MDP || 'N/A'}</div>
                    <div><strong>Lower Level Term:</strong> ${hit.LLT || 'N/A'}</div>
                    <div><strong>Number of Check-ins:</strong> ${hit.NR || 'N/A'}</div>
                    <div><strong>Checkin Span:</strong> ${hit.CS || 'N/A'}</div>
                    <div><strong>Vaccine Enthusiast:</strong> ${hit.VE || 'N/A'}</div>
                </div>
            `).join('');
    }

    function displayFacets(containerId, facetValues, facetName) {
        const container = document.getElementById(containerId);
        if (!facetValues) return;

        let entries = Object.entries(facetValues);

        // Filter searchable facets based on search input
        if (['AGE', 'PT', 'LLT', 'NR', 'MDP', 'CS'].includes(facetName) && facetSearchValues[facetName]) {
            const searchTerm = facetSearchValues[facetName].toLowerCase();
            entries = entries.filter(([value]) =>
                value.toLowerCase().includes(searchTerm)
            );
        }

        // Sort by count (descending)
        entries.sort(([, a], [, b]) => b - a);

        // Take only top 5 entries
        entries = entries.slice(0, 5);

        const facetHtml = entries.map(([value, count]) => `
                <div class="facet-value">
                    <label>
                        <input type="checkbox"
                            value="${value}"
                            ${currentRefinements[facetName].includes(value) ? 'checked' : ''}
                            onchange="toggleRefinement('${facetName}', '${value}')">
                        ${value}
                    </label>
                    <span class="facet-count">${count}</span>
                </div>
            `).join('');

        container.innerHTML = facetHtml;
    }

    function toggleRefinement(facetName, value) {
        const index = currentRefinements[facetName].indexOf(value);
        if (index === -1) {
            currentRefinements[facetName].push(value);
        } else {
            currentRefinements[facetName].splice(index, 1);
        }
        performSearch();
    }

    function handleFacetSearch(facetName) {
        return function (event) {
            facetSearchValues[facetName] = event.target.value;
            performSearch();
        };
    }

    document.getElementById('searchBox').addEventListener('input', performSearch);
    document.getElementById('ageSearch').addEventListener('input', handleFacetSearch('AGE'));
    document.getElementById('ptSearch').addEventListener('input', handleFacetSearch('PT'));
    document.getElementById('mdpSearch').addEventListener('input', handleFacetSearch('MDP'));
    document.getElementById('lltSearch').addEventListener('input', handleFacetSearch('LLT'));
    document.getElementById('nrSearch').addEventListener('input', handleFacetSearch('NR'));
    document.getElementById('csSearch').addEventListener('input', handleFacetSearch('CS'));

    performSearch();
</script>
</body>
</html>
