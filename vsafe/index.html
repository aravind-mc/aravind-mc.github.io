<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-safe timeline</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .response-id {
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .response-id:hover {
            overflow: visible;
            white-space: normal;
        }
        .nested-table {
            width: 100%;
            margin-top: 10px;
        }
        .bg-orange {
            background-color: #fd7e14 !important;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">v-safe timeline</h1>
    <p></p>
    <h3 class="mb-4"><b>Registrant Code: </b><span id="spnRegistrantCode"></span></h3>
    <p></p>
    <!-- Table placeholders -->
    <div id="registrants-table"></div>
    <div id="vaccinations-table"></div>
    <div id="timeline-chart"></div>
    <div id="checkins-table"></div>
    <div id="sro-table"></div>
    <div id="sd-table"></div>
    <div id="hcvo-table"></div>
    <div id="callcenter-table"></div>
    <div id="gdit-table"></div>
    <div id="freetext-table"></div>
</div>

<script>

    let globalData = {
        vaccinations: null,
        checkins: null
    };

    // Function to decompress gzipped content
    async function decompressGzip(response) {
        const arrayBuffer = await response.arrayBuffer();
        const ds = new DecompressionStream('gzip');
        const stream = new Response(arrayBuffer).body.pipeThrough(ds);
        const decompressedResponse = await new Response(stream).text();
        return decompressedResponse;
    }

    // Get the ID parameter from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    $('#spnRegistrantCode').text(id);

    if (id && id.length > 2) {
        const filePrefix = id.substring(0, 2).toUpperCase();
        const folderOrder = ['registrants', 'vaccinations', 'checkins', 'sro', 'sd', 'hcvo', 'callcenter', 'gdit', 'freetext'];
        const tableTitles = {
            registrants: 'Registrant',
            vaccinations: 'Vaccinations',
            checkins: 'Checkins',
            sro: 'Systemic Reaction Other',
            sd: 'Symptom Description',
            hcvo: 'Healthcare Visit Other',
            callcenter: 'Call Center',
            gdit: 'GDIT',
            freetext: 'Free Text Responses'
        };

        // Process each folder
        folderOrder.forEach(async folder => {
            try {
                const csvUrl = `csv_gz/${folder}/${filePrefix}.csv.gz`;
                const response = await fetch(csvUrl);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Decompress the gzipped content
                const decompressedData = await decompressGzip(response);

                // Parse the CSV data
                Papa.parse(decompressedData, {
                    header: true,
                    complete: function (results) {
                        console.log(`Parsed data from ${csvUrl}:`, results.data);

                        // Filter rows by the full ID in the REGISTRANT_CODE column
                        const filteredData = results.data.filter(row => row.REGISTRANT_CODE === id);

                        if (filteredData.length > 0) {
                            switch (folder) {
                                case 'checkins':
                                    createCheckinsTable(filteredData, tableTitles[folder], `#${folder}-table`);
                                    break;
                                case 'vaccinations':
                                    createVaccinationsTable(filteredData, tableTitles[folder], `#${folder}-table`);
                                    break;
                                case 'sro':
                                case 'sd':
                                case 'hcvo':
                                    createNestedSymptomsTable(filteredData, tableTitles[folder], `#${folder}-table`);
                                    break;
                                case 'freetext':
                                    createFreetextTable(filteredData, tableTitles[folder], `#${folder}-table`);
                                    break;
                                case 'callcenter':
                                    createTransposedTable(filteredData, tableTitles[folder], `#${folder}-table`, 'REPORTED_DATE');
                                    break;
                                case 'gdit':
                                    createTransposedTable(filteredData, tableTitles[folder], `#${folder}-table`, 'REPORTEDDATE');
                                    break;
                                default:
                                    createTransposedTable(filteredData, tableTitles[folder], `#${folder}-table`, 'REGISTERED_DATE');
                            }
                        } else {
                            console.log(`No matching data found in ${csvUrl} for REGISTRANT_CODE ${id}.`);
                        }
                    },
                    error: function (error) {
                        console.error(`Error parsing CSV from ${csvUrl}:`, error);
                    }
                });
            } catch (error) {
                console.error(`Error processing ${folder}:`, error);
            }
        });



        // [Rest of the table creation functions remain the same]
        function createTransposedTable(data, title, containerId, sortedField) {
            if (data[0].hasOwnProperty(sortedField)) {
                data.sort((a, b) => new Date(a[sortedField]) - new Date(b[sortedField]));
            }

            const fieldKeys = Object.keys(data[0]).filter(key => !['REGISTRANT_CODE', 'REG_CODE_PREFIX', 'REG_PREFIX'].includes(key));

            let tableHtml = `<h2>${title}</h2><table class="table table-striped table-bordered"><thead><tr><th>${sortedField}</th>`;

            data.forEach(record => {
                tableHtml += `<th>${record[sortedField]}</th>`;
            });
            tableHtml += `</tr></thead><tbody>`;

            fieldKeys.forEach(field => {
                tableHtml += `<tr><td>${field}</td>`;
                data.forEach(record => {
                    tableHtml += `<td>${record[field]}</td>`;
                });
                tableHtml += `</tr>`;
            });

            tableHtml += `</tbody></table>`;
            $(containerId).html(tableHtml);
        }

        function createFreetextTable(data, title, containerId) {
            if (data[0].hasOwnProperty('STARTED_ON')) {
                data.sort((a, b) => new Date(a.STARTED_ON) - new Date(b.STARTED_ON));
            }

            const fieldKeys = Object.keys(data[0]).filter(key =>
                !['REGISTRANT_CODE', 'REG_CODE_PREFIX', 'REG_PREFIX'].includes(key)
            );

            let tableHtml = `<h2>${title}</h2><table class="table table-striped table-bordered">`;

            tableHtml += '<thead><tr>';
            fieldKeys.forEach(field => {
                tableHtml += `<th>${field}</th>`;
            });
            tableHtml += '</tr></thead><tbody>';

            data.forEach(row => {
                tableHtml += '<tr>';
                fieldKeys.forEach(field => {
                    tableHtml += `<td>${row[field] || ''}</td>`;
                });
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table>';
            $(containerId).html(tableHtml);
        }

        function updateTimelineChart() {
            if (globalData.vaccinations && globalData.checkins) {
                const chartHtml = createCheckinChart(globalData.vaccinations, globalData.checkins);
                $('#timeline-chart').html(chartHtml);
            }
        }

        function createCheckinChart(vaccinations, checkins) {
            if (!vaccinations || !checkins) return '';
            // Process vaccinations data
            const vaccinationDates = vaccinations.map(row => ({
                date: new Date(row.VACCINATION_DATE),
                dose: row.DOSE_NUMBER,
                type: 'vaccination'
            }));

            // Process checkins data
            const checkinDates = checkins.map(row => ({
                date: new Date(row.STARTED_ON),
                healthImpact: row.HEALTH_IMPACT?.toLowerCase() || '',
                healthcareVisits: row.HEALTHCARE_VISITS?.toLowerCase() || '',
                type: 'checkin'
            }));

            // Combine all dates
            const allDates = [...vaccinationDates, ...checkinDates];

            function getStatusColor(entry) {
                if (entry.type === 'vaccination') {
                    return 'primary';
                }

                let color = 'light';
                if (entry.healthImpact?.includes('care')) {
                    color = 'warning';
                }
                if (entry.healthcareVisits?.includes('emergency')) {
                    color = 'orange';
                }
                if (entry.healthcareVisits?.includes('hospital')) {
                    color = 'danger';
                }
                return color;
            }

            const yearGroups = allDates.reduce((groups, entry) => {
                const year = entry.date.getFullYear();
                if (!groups[year]) groups[year] = [];
                groups[year].push(entry);
                return groups;
            }, {});

            // Rest of the function remains the same
            const years = Object.keys(yearGroups).sort();
            const squareSize = 14;
            const margin = 1;
            const totalSquareSize = squareSize + (margin * 2);

            let chartHtml = '<div class="contribution-chart mb-4">';

            years.forEach(year => {
                const startDate = new Date(year, 0, 1);
                const months = Array.from({ length: 12 }, (_, i) => {
                    const monthStart = new Date(year, i, 1);
                    const nextMonth = new Date(year, i + 1, 0);
                    return {
                        name: monthStart.toLocaleString('default', { month: 'short' }),
                        startWeek: Math.floor((monthStart - startDate) / (7 * 24 * 60 * 60 * 1000)),
                        weeks: Math.ceil((nextMonth.getDate() - monthStart.getDate() + monthStart.getDay()) / 7)
                    };
                });

                const totalWeeks = Math.ceil((new Date(year, 11, 31) - startDate) / (7 * 24 * 60 * 60 * 1000)) + 1;

                chartHtml += `
            <div class="mb-5">
                <h5 class="mb-2">${year}</h5>
                <div class="ms-4">
                    <div class="d-flex">
                        ${months.map(month => `
                            <div style="width: ${month.weeks * totalSquareSize}px;
                                      margin-left: ${month.startWeek * totalSquareSize}px;
                                      position: absolute;
                                      font-size: 11px;"
                                 class="text-muted">
                                ${month.name}
                            </div>
                        `).join('')}
                    </div>

                    <div class="d-flex flex-wrap" style="margin-top: 18px;">`;

                for (let w = 0; w < totalWeeks; w++) {
                    chartHtml += '<div class="d-flex flex-column">';
                    for (let d = 0; d < 7; d++) {
                        const currentDate = new Date(startDate);
                        currentDate.setDate(currentDate.getDate() + (w * 7 + d));

                        // Find all entries for this date
                        const entriesForDate = allDates.filter(entry =>
                            entry.date.toDateString() === currentDate.toDateString()
                        );

                        // Sort to prioritize the most severe status
                        const mostSevereEntry = entriesForDate.sort((a, b) => {
                            if (a.type === 'vaccination' && b.type === 'checkin') return -1;
                            return 1;
                        })[0];

                        const colorClass = mostSevereEntry ? getStatusColor(mostSevereEntry) : 'light';
                        const textClass = colorClass === 'light' || colorClass === 'warning' ? 'text-dark' : 'text-white';
                        const doseLabel = mostSevereEntry?.type === 'vaccination' ? `D${mostSevereEntry.dose}` : '';

                        let title = currentDate.toLocaleDateString();
                        if (entriesForDate.length > 0) {
                            title += entriesForDate.map(entry => {
                                if (entry.type === 'vaccination') {
                                    return ` - Vaccination Dose ${entry.dose}`;
                                }
                                return ` - ${entry.healthImpact} ${entry.healthcareVisits}`;
                            }).join('\n');
                        }

                        chartHtml += `
                    <div class="contribution-cell bg-${colorClass} border ${textClass}"
                         style="width: ${squareSize}px; height: ${squareSize}px; margin: ${margin}px; font-size: 9px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: default;"
                         title="${title}">
                        ${doseLabel}
                    </div>`;
                    }
                    chartHtml += '</div>';
                }

                chartHtml += `
                    </div>
                </div>`;
            });

            chartHtml += `
            <div class="d-flex mt-3" style="gap: 1rem;">
                <div><small class="text-muted">Empty: No data</small></div>
                <div><small class="text-primary">Blue: Vaccination</small></div>
                <div><small class="text-warning">Yellow: Care needed</small></div>
                <div><small style="color: #fd7e14">Orange: Emergency visit</small></div>
                <div><small class="text-danger">Red: Hospitalization</small></div>
            </div>
        </div>`;

            return chartHtml;
        }

        function createCheckinsTable(data, title, containerId) {
            globalData.checkins = data;
            updateTimelineChart();

            // Extract and group by dose number
            const doseGroups = data.reduce((groups, row) => {
                const match = row.SURVEY_STATIC_ID?.match(/dose(\d+)/i);
                const doseNum = match ? match[1] : 'unknown';
                if (!groups[doseNum]) groups[doseNum] = [];
                groups[doseNum].push(row);
                return groups;
            }, {});

            const doses = Object.keys(doseGroups).sort();

            // Create tab navigation
            let tableHtml = `
        <p></p>
        <h2>${title}</h2>
        <ul class="nav nav-tabs" role="tablist">`;

            doses.forEach((dose, index) => {
                tableHtml += `
            <li class="nav-item">
                <a class="nav-link ${index === 0 ? 'active' : ''}"
                   data-toggle="tab"
                   href="#dose${dose}"
                   role="tab">Dose ${dose}</a>
            </li>`;
            });

            tableHtml += `</ul><div class="tab-content">`;

            // Create tab content for each dose
            doses.forEach((dose, index) => {
                const doseData = doseGroups[dose];
                doseData.sort((a, b) => Number(a.DAYS_SINCE) - Number(b.DAYS_SINCE));

                // Split data using DAYS_SINCE
                const firstTenDays = doseData.filter(row => Number(row.DAYS_SINCE) <= 10);
                const afterTenDays = doseData.filter(row => Number(row.DAYS_SINCE) > 10);

                tableHtml += `
            <div class="tab-pane fade ${index === 0 ? 'show active' : ''}"
                 id="dose${dose}" role="tabpanel">`;

                // Function to create a table for a given dataset
                const createTableSection = (data, subtitle) => {
                    if (data.length === 0) return '';

                    const responseIds = [...new Set(data.map(row => row.RESPONSE_ID))];
                    const fieldKeys = Object.keys(data[0]).filter(key =>
                        !['RESPONSE_ID', 'REGISTRANT_CODE', 'REG_CODE_PREFIX', 'REG_PREFIX'].includes(key)
                    );

                    let sectionHtml = `
                <h4 class="mt-4">${subtitle}</h4>
                <table class="table table-striped table-bordered mt-3">
                    <thead>
                        <tr>
                            <th>Field</th>`;

                    responseIds.forEach(responseId => {
                        sectionHtml += `
                    <th class="response-id" title="${responseId}">${responseId.substring(0, 5)}...</th>`;
                    });

                    sectionHtml += `
                        </tr>
                    </thead>
                    <tbody>`;

                    fieldKeys.forEach(field => {
                        sectionHtml += `
                    <tr>
                        <td>${field}</td>`;

                        responseIds.forEach(responseId => {
                            const matchingRows = data.filter(row => row.RESPONSE_ID === responseId);
                            const values = matchingRows.map(row => row[field] || '').join(', ');
                            sectionHtml += `
                        <td>${values}</td>`;
                        });

                        sectionHtml += `
                    </tr>`;
                    });

                    sectionHtml += `
                    </tbody>
                </table>`;

                    return sectionHtml;
                };

                // Add first 10 days table
                tableHtml += createTableSection(firstTenDays, 'First 10 Days After Vaccination');

                // Add after 10 days table
                tableHtml += createTableSection(afterTenDays, 'After 10 Days Post-Vaccination');

                tableHtml += `</div>`;
            });

            tableHtml += `</div>`;

            $(containerId).html(tableHtml);
        }

        function createVaccinationsTable(data, title, containerId) {

            globalData.vaccinations = data;
            updateTimelineChart();

            let checkinHtml = createCheckinChart(data, window.checksinData);
            window.checkinHtml = checkinHtml;

            data.sort((a, b) => new Date(a.VACCINATION_DATE) - new Date(b.VACCINATION_DATE));

            const fieldKeys = Object.keys(data[0]).filter(key => !['REGISTRANT_CODE', 'REG_CODE_PREFIX', 'REG_PREFIX'].includes(key));

            let tableHtml = `<h2>${title}</h2><table class="table table-striped table-bordered"><thead><tr><th>VACCINATION DATE</th>`;

            data.forEach(row => {
                tableHtml += `<th>${row.VACCINATION_DATE}</th>`;
            });
            tableHtml += `</tr></thead><tbody>`;

            fieldKeys.forEach(field => {
                tableHtml += `<tr><td>${field}</td>`;
                data.forEach(row => {
                    tableHtml += `<td>${row[field]}</td>`;
                });
                tableHtml += `</tr>`;
            });

            tableHtml += `</tbody></table>`;
            $(containerId).html(tableHtml);
        }

        function createNestedSymptomsTable(data, title, containerId) {
            const responseIds = [...new Set(data.map(row => row.RESPONSE_ID))];
            const fieldKeys = Object.keys(data[0]).filter(key => !['RESPONSE_ID', 'REGISTRANT_CODE', 'REG_CODE_PREFIX', 'REG_PREFIX', 'PT_NAME', 'LLT_NAME'].includes(key));

            let tableHtml = `<h2>${title}</h2><table class="table table-striped table-bordered"><thead><tr><th>RESPONSE ID</th>`;

            responseIds.forEach(responseId => {
                tableHtml += `<th class="response-id" title="${responseId}">${responseId.substring(0, 5)}...</th>`;
            });
            tableHtml += `</tr></thead><tbody>`;

            fieldKeys.forEach(field => {
                tableHtml += `<tr><td>${field}</td>`;
                responseIds.forEach(responseId => {
                    const matchingRow = data.find(row => row.RESPONSE_ID === responseId);
                    tableHtml += `<td>${matchingRow ? matchingRow[field] : ''}</td>`;
                });
                tableHtml += `</tr>`;
            });

            tableHtml += `<tr><td>SYMPTOMS</td>`;
            responseIds.forEach(responseId => {
                const ptLltPairs = data.filter(row => row.RESPONSE_ID === responseId).map(row => ({
                    PT_NAME: row.PT_NAME,
                    LLT_NAME: row.LLT_NAME
                }));

                let nestedTableHtml = `<table class="table nested-table"><thead><tr><th>PT_NAME</th><th>LLT_NAME</th></tr></thead><tbody>`;
                ptLltPairs.forEach(pair => {
                    nestedTableHtml += `<tr><td>${pair.PT_NAME}</td><td>${pair.LLT_NAME}</td></tr>`;
                });
                nestedTableHtml += `</tbody></table>`;

                tableHtml += `<td>${nestedTableHtml}</td>`;
            });
            tableHtml += `</tr>`;

            tableHtml += `</tbody></table>`;
            $(containerId).html(tableHtml);
        }
    }
</script>
</body>
</html>
